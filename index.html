<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><title>Postcoglu</title><style>body{font-family:Arial;max-width:700px;margin:auto;padding:20px;background:#eef2ff}.card{background:#fff;padding:20px;border-radius:16px;text-align:center;box-shadow:0 4px 20px #0001}.logo{width:240px}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{background:#0e46d0;color:#fff;padding:14px;border:none;border-radius:8px;width:100%;font-size:16px;font-weight:bold}#out{text-align:left;white-space:pre-wrap;background:#f8f9ff;padding:15px;border-radius:8px;margin-top:12px}</style></head><body><div class="card"><img src="IMG-20260912-WA8148.jpg" class="logo"><h1>Postcoglu</h1><p>AI-Powered Documentation Platform</p><input id="co" placeholder="Company Name"><select id="ty"><option>SOP - Standard Operating Procedure</option><option>Company Policy</option><option>Work Procedure</option></select><textarea id="de" placeholder="Describe doc e.g. Bus daily inspection"></textarea><button onclick="gen()">✨ Generate with AI</button><div id="out">Your document will appear here...</div></div><script>function gen(){let c=document.getElementById('co').value||'Company';let t=document.getElementById('ty').value;let d=document.getElementById('de').value||'tasks';let o=document.getElementById('out');o.innerText='Generating...';setTimeout(()=>{o.innerText=t+'\nCompany: '+c+'\nDate: '+new Date().toLocaleDateString()+'\n\n1.PURPOSE\nStandardize '+d+' for '+c+'\n\n2.SCOPE\nAll staff\n\n3.PROCEDURE\n1.Prepare\n2.Execute '+d+'\n3.Verify\n4.Document & Report\n\n4.COMPLIANCE\nMust follow - monthly audit\n\n[Generated by Postcoglu AI MVP - John]';},1200);}</script></body></html>
