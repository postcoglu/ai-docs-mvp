<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postcoglu Ltd</title>
<style>
body{font-family:Arial;padding:15px;max-width:700px;margin:auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
header img{height:48px}
textarea{width:100%;height:90px;padding:12px;font-size:16px;border:2px solid #0d2a54;border-radius:8px}
button{width:100%;padding:14px;background:#0d2a54;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-top:10px}
#output{white-space:pre-wrap;background:#f6f8ff;padding:15px;border-radius:8px;margin-top:15px;border-left:4px solid #1565d8}
small{color:#666}
</style></head><body>
<header>
<img src="logo.png" onerror="this.style.display='none'">
<div><b style="font-size:20px">Postcoglu Ltd</b><br><small>AI-Powered Documentation Platform - LEGIT FREE EDITION</small></div>
</header>
<hr style="border:2px solid #0d2a54">
<label>What document do you need?</label>
<textarea id="prompt" placeholder="Example: Receipts, Sales invoice for 3 days bus hire 1.5M per day, Bus inspection checklist 51 seater"></textarea>
<button onclick="generate()">Generate with AI - FREE</button>
<div id="output">Your EFRIS compliant document will appear here...</div>
<button onclick="window.print()" style="background:#1565d8;margin-top:8px">📄 Download PDF / Print</button>
<script>
async function generate(){
 const p=document.getElementById('prompt').value;
 if(!p){alert('Type document needed');return}
 document.getElementById('output').innerText='Generating...';
 try{
  const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
  const d=await r.json();
  document.getElementById('output').innerText=d.text||d.error;
 }catch(e){document.getElementById('output').innerText='Error: '+e.message}
}
</script>
</body></html>
